<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #181818;
    --orange: #FF5F1F;
    --orange-dim: #cc4a15;
    --orange-glow: rgba(255,95,31,0.18);
    --text: #f0ede8;
    --muted: #7a7570;
    --border: rgba(255,255,255,0.07);
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 300;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.4rem 5vw;
    background: rgba(10,10,10,0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: var(--font-head);
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
  }
  .nav-logo span { color: var(--orange); }
  nav a.cta-small {
    color: var(--text);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.3rem;
    text-decoration: none;
    letter-spacing: -0.01em;
    transition: color 0.2s;
  }
  nav a.cta-small:hover { color: var(--orange); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10rem 5vw 6rem;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0a0a0a 0%, #111111 100%);
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.75) 50%, rgba(10,10,10,0.3) 100%);
    pointer-events: none;
  }
  .hero-kicker {
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--orange);
    font-weight: 500;
    margin-bottom: 1.8rem;
    opacity: 0;
    animation: fadeUp 0.7s 0.1s ease forwards;
  }
  .hero h1 {
    font-family: var(--font-head);
    font-size: clamp(3rem, 7vw, 6.5rem);
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -0.03em;
    max-width: 780px;
    opacity: 0;
    animation: fadeUp 0.7s 0.25s ease forwards;
  }
  .hero h1 em { font-style: normal; color: var(--orange); }
  .hero-sub {
    margin-top: 2rem;
    font-size: clamp(1rem, 1.8vw, 1.2rem);
    color: var(--muted);
    max-width: 500px;
    line-height: 1.65;
    opacity: 0;
    animation: fadeUp 0.7s 0.4s ease forwards;
  }
  .hero-actions {
    margin-top: 2.8rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    opacity: 0;
    animation: fadeUp 0.7s 0.55s ease forwards;
  }
